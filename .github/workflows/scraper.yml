name: Raspador de Vagas WorkMOM

on:
  schedule:
    # Executa diariamente às 6:00 UTC (3:00 da manhã horário de Brasília)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite execução manual

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
      
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Instalar dependências
        run: |
          cd backend
          npm install
      
      - name: Instalar Playwright
        run: |
          npx playwright install --with-deps chromium
      
      - name: Executar raspador de vagas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd backend
          node scraper.js
      
      - name: Commit e push das mudanças (opcional)
        if: success()
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add .
          git diff --quiet || git commit -m "Auto: Atualizar vagas via raspador"
          git push
